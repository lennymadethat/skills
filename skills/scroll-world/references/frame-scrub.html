<!doctype html>
<!-- Scroll World · Technique A: pre-rendered frame scrub (self-contained boilerplate).
     Drop frames into ./frames/f_0001.webp … f_NNNN.webp and set FRAME_COUNT. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroll World</title>
<style>
  :root { --bg: #07090b; --text: #eef1f3; --dim: #9aa4ab; --accent: #2ee6c5; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }

  /* the tall scroller: 100vh per story beat + one for entry */
  .scrollworld { position: relative; height: calc(var(--beats) * 100vh + 100vh); }
  .stage { position: sticky; top: 0; height: 100dvh; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .copy {
    position: absolute; max-width: 340px; opacity: 0;
    transform: translateY(24px); transition: none; /* driven by JS, not CSS */
  }
  .copy h2 { font-size: 28px; letter-spacing: -.02em; margin-bottom: 8px; }
  .copy p { color: var(--dim); }
  .copy .kicker { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) {
    .scrollworld { height: auto; }
    .stage { position: static; height: auto; }
    .copy { position: static; opacity: 1 !important; transform: none !important; max-width: 640px; margin: 48px auto; }
  }
</style>
</head>
<body>
<section class="scrollworld" id="sw" style="--beats: 4">
  <div class="stage">
    <canvas id="swCanvas"></canvas>
    <!-- each copy block owns a progress range [data-a, data-b] and a position -->
    <div class="copy" data-a="0.05" data-b="0.25" style="left: 8vw; top: 20vh">
      <div class="kicker">Beat one</div><h2>Headline</h2><p>Feature copy.</p>
    </div>
    <div class="copy" data-a="0.30" data-b="0.50" style="right: 8vw; top: 24vh">
      <div class="kicker">Beat two</div><h2>Headline</h2><p>Feature copy.</p>
    </div>
    <div class="copy" data-a="0.55" data-b="0.75" style="left: 8vw; bottom: 18vh">
      <div class="kicker">Beat three</div><h2>Headline</h2><p>Feature copy.</p>
    </div>
    <div class="copy" data-a="0.80" data-b="0.98" style="right: 8vw; bottom: 22vh">
      <div class="kicker">Beat four</div><h2>Headline</h2><p>Feature copy.</p>
    </div>
  </div>
</section>

<script>
(() => {
  const FRAME_COUNT = 180;                       // total frames on disk
  const src = (i) => `frames/f_${String(i + 1).padStart(4, '0')}.webp`;
  const EAGER = 24;                              // frames to block reveal on

  const canvas = document.getElementById('swCanvas');
  const ctx = canvas.getContext('2d');
  const section = document.getElementById('sw');
  const copies = [...section.querySelectorAll('.copy')];
  const frames = new Array(FRAME_COUNT);
  let current = -1, target = 0, drawn = -1;

  // --- loading: first N eagerly, the rest opportunistically in order
  const load = (i) => frames[i] || (frames[i] = new Promise((res) => {
    const img = new Image(); img.decoding = 'async';
    img.onload = () => res(img); img.onerror = () => res(null); img.src = src(i);
  }));
  Promise.all(Array.from({ length: EAGER }, (_, i) => load(i))).then(() => draw(0));
  (async () => { for (let i = EAGER; i < FRAME_COUNT; i++) await load(i); })();

  // --- sizing (cover-fit the frame into the viewport, device-pixel aware)
  let iw = 0, ih = 0;
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  };
  addEventListener('resize', size, { passive: true }); size();

  async function draw(i) {
    const img = await load(i);
    if (!img) return;
    if (!iw) { iw = img.naturalWidth; ih = img.naturalHeight; }
    drawn = i;
    const cw = canvas.width, ch = canvas.height;
    const s = Math.max(cw / iw, ch / ih);           // cover
    const w = iw * s, h = ih * s;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  // --- scroll → progress → frame + copy opacity, all inside one rAF loop
  const progress = () => {
    const r = section.getBoundingClientRect();
    return Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
  };
  const tick = () => {
    const p = progress();
    target = Math.round(p * (FRAME_COUNT - 1));
    // ease toward target so fast flicks don't strobe
    if (current < 0) current = target;
    current += (target - current) * 0.35;
    const f = Math.round(current);
    if (f !== drawn) draw(f);

    for (const c of copies) {
      const a = +c.dataset.a, b = +c.dataset.b, span = (b - a) * 0.25;
      // fade in over the first quarter of the range, out over the last
      const o = p < a || p > b ? 0
        : p < a + span ? (p - a) / span
        : p > b - span ? (b - p) / span : 1;
      c.style.opacity = o.toFixed(3);
      c.style.transform = `translateY(${(1 - o) * 24}px)`;
    }
    requestAnimationFrame(tick);
  };
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);
  else draw(0);
})();
</script>
</body>
</html>
